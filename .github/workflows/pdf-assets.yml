name: pdf-assets
on:
  push:
    branches: [pdf-assets]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[assets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p font-dl && cd font-dl
          curl -fsSL -A "Mozilla/5.0" "https://dl.dafont.com/dl/?f=loverine" -o loverine.zip
          unzip -o loverine.zip && ls -la
          cd .. && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add font-dl && git commit -m "font [assets]" && git push
